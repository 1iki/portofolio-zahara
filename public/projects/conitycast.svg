<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A" />
      <stop offset="50%" stop-color="#071429" />
      <stop offset="100%" stop-color="#101418" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A7FE8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#071429" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F5F3EC" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <pattern id="scanline" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <circle cx="640" cy="360" r="500" fill="url(#glow)" />

  <!-- Outer Console Frame -->
  <rect x="40" y="40" width="1200" height="640" rx="8" fill="none" stroke="rgba(245,243,236,0.15)" stroke-width="2" />
  
  <!-- CRT Monitor Corner Crosshairs -->
  <path d="M 60 90 L 60 60 L 90 60" stroke="#4A7FE8" stroke-width="3" fill="none" />
  <path d="M 1220 90 L 1220 60 L 1190 60" stroke="#4A7FE8" stroke-width="3" fill="none" />
  <path d="M 60 630 L 60 660 L 90 660" stroke="#4A7FE8" stroke-width="3" fill="none" />
  <path d="M 1220 630 L 1220 660 L 1190 660" stroke="#4A7FE8" stroke-width="3" fill="none" />

  <!-- Header Indicator Bar -->
  <rect x="80" y="80" width="1120" height="40" rx="4" fill="#071429" stroke="rgba(245,243,236,0.1)" stroke-width="1" />
  <circle cx="105" cy="100" r="6" fill="#E8442C" />
  <text x="122" y="104" fill="#E8442C" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">TIKTOK BROADCAST FEED • CONITYCAST</text>
  <text x="1170" y="104" fill="#8FA0C2" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">CH-01 // REPOST</text>

  <!-- Center Card Content -->
  <g transform="translate(640, 360)">
    <!-- TikTok Icon Background Shield -->
    <rect x="-180" y="-120" width="360" height="240" rx="12" fill="#071429" stroke="#4A7FE8" stroke-width="2" opacity="0.85" />
    
    <!-- TikTok Play Note Icon -->
    <path d="M -20 -40 L 20 -40 C 20 -40, 25 -10, 45 -5 L 45 15 C 30 15, 20 5, 20 5 L 20 30 C 20 52, 2 -3, -20 15 C -35 25, -45 5, -35 -15 C -25 -30, -5 -25, -2 -10 L -2 -40 Z" fill="#4A7FE8" opacity="0.9" />
    <path d="M -16 -36 L 24 -36 C 24 -36, 29 -6, 49 -1 L 49 19 C 34 19, 24 9, 24 9 L 24 34 C 24 56, 6 1, -16 19 C -31 29, -41 9, -31 -11 C -21 -26, -1 -21, 2 -6 L 2 -36 Z" fill="#E8442C" opacity="0.8" />

    <!-- Center Typography -->
    <text x="0" y="170" fill="#F5F3EC" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="1">KONTEN MOMEN KETIKA</text>
    <text x="0" y="205" fill="#4A7FE8" font-family="monospace" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="3">CONITYCAST • PRODUSER (FEB–JUN 2025)</text>
  </g>

  <!-- Footer Metadata Overlay -->
  <rect x="80" y="600" width="1120" height="40" rx="4" fill="#071429" stroke="rgba(245,243,236,0.1)" stroke-width="1" />
  <text x="105" y="624" fill="#8FA0C2" font-family="monospace" font-size="12" letter-spacing="1">PLATFORM: TIKTOK / INSTAGRAM</text>
  <text x="1170" y="624" fill="#F5F3EC" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">TARGET: 1.000 VIEWS MAHASISWA</text>

  <!-- CRT Scanline Texture -->
  <rect width="1280" height="720" fill="url(#scanline)" pointer-events="none" />
</svg>
